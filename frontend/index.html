<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Cartera</title>
    <script>
      // Aplica el tema claro/oscuro guardado (`useColorMode.js`) antes de que cargue el CSS/React,
      // para evitar un parpadeo del tema claro en cada carga de página.
      (function () {
        try {
          if (localStorage.getItem('tema-color-modo') === '1') {
            document.documentElement.setAttribute('data-theme', 'dark')
            document.documentElement.setAttribute('data-bs-theme', 'dark')
          }
        } catch { /* localStorage no disponible (modo privado, etc.) — se queda en tema claro. */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
